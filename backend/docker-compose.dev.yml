name: monai-dev

services:
  monai-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monai}
      POSTGRES_USER: ${POSTGRES_USER:-monai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    # Bound to localhost: reachable from this machine only.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Official MinIO images are no longer published; Chainguard builds it from source.
    image: &minio-image cgr.dev/chainguard/minio@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MC_CONFIG_DIR: /tmp/.mc
    # Bound to localhost; put a TLS proxy in front to serve files to devices.
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the buckets, makes expense-public objects readable
  # (not listable), expires
  # unattached receipt uploads after a day, and creates the API's own MinIO
  # user, limited to the two buckets. Safe to rerun.
  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-expense-private}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-expense-public}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_PRIVATE"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_PUBLIC"
        # Anonymous clients may read objects but not list the bucket.
        cat > /tmp/monai-public-read.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET_PUBLIC/*"]
            }
          ]
        }
        JSON
        mc anonymous set-json /tmp/monai-public-read.json "local/$$MINIO_BUCKET_PUBLIC"
        # Must match storage.PendingReceiptsPrefix.
        echo '{"Rules":[{"ID":"expire-pending-receipts","Status":"Enabled","Filter":{"Prefix":"receipts-pending/"},"Expiration":{"Days":1}}]}' \
          | mc ilm import "local/$$MINIO_BUCKET_PRIVATE"
        cat > /tmp/monai-api-policy.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET_PRIVATE", "arn:aws:s3:::$$MINIO_BUCKET_PUBLIC"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET_PRIVATE/*", "arn:aws:s3:::$$MINIO_BUCKET_PUBLIC/*"]
            }
          ]
        }
        JSON
        mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc admin policy create local monai-api /tmp/monai-api-policy.json
        mc admin policy attach local monai-api --user "$$MINIO_ACCESS_KEY" || true
    restart: "no"

  # One-shot job: creates the API's own database role, limited to reading and
  # writing rows (no DDL, not a superuser like POSTGRES_USER). Migrations keep
  # using the owner; default privileges cover the tables they create later.
  # Safe to rerun; it also resets the role's password to DB_APP_PASSWORD.
  monai-db-init:
    image: postgres:18-alpine
    depends_on:
      monai-db:
        condition: service_healthy
    environment:
      PGHOST: monai-db
      PGUSER: ${POSTGRES_USER:-monai}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-monai}
      DB_APP_USER: ${DB_APP_USER:-monai_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -v app_user="$$DB_APP_USER" -v app_password="$$DB_APP_PASSWORD" \
          -v owner="$$PGUSER" -v db="$$PGDATABASE" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'app_user')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          :'app_user', :'app_password') \gexec
        GRANT CONNECT ON DATABASE :"db" TO :"app_user";
        GRANT USAGE ON SCHEMA public TO :"app_user";
        GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :"app_user";
        GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO :"app_user";
        ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"app_user";
        ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA public
          GRANT USAGE, SELECT ON SEQUENCES TO :"app_user";
        SQL
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      # The API's limited role (monai-db-init). Migrations from your machine use the
      # owner URL in .env.
      DATABASE_URL: postgres://${DB_APP_USER:-monai_app}:${DB_APP_PASSWORD}@monai-db:5432/${POSTGRES_DB:-monai}?sslmode=disable&timezone=UTC
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:${MINIO_API_PORT:-9000}}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      monai-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      monai-db-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
